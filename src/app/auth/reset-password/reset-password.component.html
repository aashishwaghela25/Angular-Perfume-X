<!-- Background -->
<div class="background">
  <img
    src="../../../assets/SliderImages/slider1.png"
    alt="Perfume background img"
  />
</div>

<!-- Reset Password -->
<div class="rp-container">
  <!-- Reset Password Box-->
  <div class="rp-box">
    <h2>
      <i
        class="fa-solid fa-spray-can-sparkles"
        style="color: rgb(255, 212, 59)"
      ></i
      >Reset Password<i
        class="fa-solid fa-spray-can-sparkles"
        style="color: rgb(255, 212, 59)"
      ></i>
    </h2>
    <p class="hint">Enter the 6-digit code we sent to your email.</p>

    <form [formGroup]="resetForm" (ngSubmit)="submit()" novalidate>
      <!-- Email -->
      <input
        type="email"
        formControlName="email"
        placeholder="you@example.com"
        required
      />

      <!-- 6 digit code -->
      <input
        type="text"
        formControlName="code"
        maxlength="6"
        inputmode="numeric"
        autocomplete="one-time-code"
        class="code-input"
        placeholder="0-0-0-0-0-0"
        required
      />

      <!-- New Password -->
     <div class="form-group password-wrapper">
        <input
          [type]="showPassword ? 'text' : 'password'"
          name="password"
          placeholder="Enter new password"
          formControlName="password"
          maxlength="10"
          required
        />
        <button
          type="button"
          class="toggle-password"
          (click)="togglePassword()"
        >
          <i
            class="fa-solid"
            [ngClass]="showPassword ? 'fa-regular fa-eye fa-jello' : 'fa-eye-slash fa-jello'"
          ></i>
        </button>
      </div>

      <!--Repeat New Password -->
      <div class="form-group password-wrapper">
        <input
          [type]="showRepeatPassword ? 'text' : 'password'"
          name="repeatPassword"
          placeholder="Repeat new password"
          formControlName="repeatPassword"
          maxlength="10"
          required
        />
        <button
          type="button"
          class="toggle-password"
          (click)="toggleRepeatPassword()"
        >
          <i
            class="fa-solid"
            [ngClass]="showRepeatPassword ? 'fa-regular fa-eye fa-jello' : 'fa-eye-slash fa-jello'"
          ></i>
        </button>
      </div>

      <p class="msg-error" *ngIf="error">{{ error }}</p>
      <p class="msg-success" *ngIf="success">{{ success }}</p>

      <button type="submit" [disabled]="loading">
        {{ loading ? "Resetting..." : "Reset Password" }}
      </button>
    </form>

    <p>
      Didn't get a code?
      <a>Resend</a>
    </p>
  </div>
</div>
