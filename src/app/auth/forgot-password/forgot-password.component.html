<!-- Background -->
<div class="background">
  <img
    src="../../../assets/SliderImages/slider1.png"
    alt="Perfume background img"
  />
</div>

<!-- Forgot Password -->
<div class="fp-container">
  <!-- Forgot Password Box -->
  <div class="fp-box">
    <h2>
      <i
        class="fa-solid fa-spray-can-sparkles"
        style="color: rgb(255, 212, 59)"
      ></i
      >Forgot Password
      <i
        class="fa-solid fa-spray-can-sparkles"
        style="color: rgb(255, 212, 59)"
      ></i>
    </h2>
    <p>Enter your registered email and we'll send you a reset link.</p>

    <form [formGroup]="fpForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <input
          type="email"
          name="email"
          placeholder="Enter your email"
          formControlName="email"
          required
        />
      </div>
      <button
        type="submit"
        class="link-btn"
        [disabled]="fpForm.invalid || loading"
      >
        {{ loading ? "Sending..." : "Send Reset Link" }}
      </button>

      <button type="button" class="back" routerLink="/login">← Back</button>
    </form>

    <p *ngIf="message">{{ message }}</p>
  </div>
</div>
