<!-- Background -->
<div class="background">
  <img src="../../../assets/SliderImages/slider1.png" alt="Perfume background img" />
</div>

<!-- Login Container -->
<div class="login-container">
  <!-- Login Box -->
  <div class="login-box">
    <h2>
      <i
        class="fa-solid fa-spray-can-sparkles"
        style="color: rgb(255, 212, 59)"
      ></i
      >Login<i
        class="fa-solid fa-spray-can-sparkles"
        style="color: rgb(255, 212, 59)"
      ></i>
    </h2>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <input
          type="email"
          name="email"
          placeholder="Enter Email Address"
          formControlName="email"
          required
        />
      </div>

      <!-- Password -->
      <div class="form-group password-wrapper">
        <input
          [type]="showPassword ? 'text' : 'password'"
          name="password"
          placeholder="Enter Password"
          formControlName="password"
          maxlength="10"
          required
        />
        <button
          type="button"
          class="toggle-password"
          (click)="togglePassword()"
        >
          <i
            class="fa-solid"
            [ngClass]="showPassword ? 'fa-regular fa-eye fa-jello' : 'fa-eye-slash fa-jello'"
          ></i>
        </button>
      </div>

      <a routerLink="/forgot-password" class="forget-password"
        >Forgot Password</a
      >

      <button type="submit" [disabled]="loginForm.invalid">Login</button>
    </form>

    <p>
      Don't have an account ?
      <a routerLink="/signup">Create Account</a>
    </p>
  </div>
</div>
