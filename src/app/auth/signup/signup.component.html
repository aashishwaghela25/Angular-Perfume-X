<!-- Background -->
<div class="background">
  <img src="assets/images/Perfume1.png" alt="Perfume" />
</div>

<!-- Signup Container -->
<div class="signup-container">
  <!-- Signup Box -->
  <div class="signup-box">
    <h2>
      <i
        class="fa-solid fa-spray-can-sparkles"
        style="color: rgb(255, 212, 59)"
      ></i>
      Create Account
      <i
        class="fa-solid fa-spray-can-sparkles"
        style="color: rgb(255, 212, 59)"
      ></i>
    </h2>

    <!-- Form -->
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <!-- Name -->
      <div class="form-group">
        <input
          type="text"
          name="name"
          placeholder="Enter Name"
          formControlName="name"
          required
        />
        <small
          *ngIf="
            signupForm.get('name')?.touched &&
            signupForm.get('name')?.hasError('required')"
          >Name is required</small>
      </div>

      <!-- Email -->
      <div class="form-group">
        <input
          type="email"
          name="email"
          placeholder="Enter Email Address"
          formControlName="email"
          required
        />
        <small
          *ngIf="
            signupForm.get('email')?.touched &&
            signupForm.get('email')?.hasError('email')"
          >Email is required</small>
      </div>

      <!-- Mobile Number -->
      <div class="form-group">
        <input
          type="number"
          name="mobile"
          placeholder="Enter Mobile Number"
          formControlName="mobile"
          maxlength="10"
          required
        />
        <small
          *ngIf="
            signupForm.get('mobile')?.touched &&
            signupForm.get('mobile')?.hasError('require')"
          >Mobile number is required</small>
      </div>

      <!-- Password -->
      <div class="form-group">
        <input
          type="Password"
          name="password"
          placeholder="Enter Password"
          formControlName="password"
          maxlength="10"
          required
        />
        <small
          *ngIf="
            signupForm.get('password')?.touched &&
            signupForm.get('password')?.hasError('minlength')"
          > Password must be exactly 10 characters</small>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <input
          type="Password"
          name="confirmPassword"
          placeholder="Enter Confirm Password"
          formControlName="confirmPassword"
          maxlength="10"
          required
        />
        <small
          *ngIf="
            signupForm.get('confirmPassword')?.touched &&
            signupForm.get('confirmPassword')?.hasError('required')"
          >ConfirmPassword is required</small>
      </div>

      <!-- Button -->
      <button type="submit">Sign Up</button>
    </form>

    <p>
      Already have an account ?
      <a>Login</a>
    </p>
  </div>
</div>
