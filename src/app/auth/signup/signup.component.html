<!-- Background -->
<div class="background">
  <img src="../../../assets/SliderImages/slider1.png" alt="Perfume" />
</div>

<!-- Signup Container -->
<div class="signup-container">
  <!-- Signup Box -->
  <div class="signup-box">
    <h2>
      <i
        class="fa-solid fa-spray-can-sparkles"
        style="color: rgb(255, 212, 59)"
      ></i>
      Create Account
      <i
        class="fa-solid fa-spray-can-sparkles"
        style="color: rgb(255, 212, 59)"
      ></i>
    </h2>

    <!-- Form -->
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <!-- Name -->
      <div class="form-group">
        <input
          type="text"
          name="name"
          placeholder="Enter Name"
          formControlName="name"
          required
        />
        <span class="text-danger"
          *ngIf="
            signupForm.get('name')?.touched &&
            signupForm.get('name')?.hasError('required')"
          >Name is required</span>
      </div>

      <!-- Email -->
      <div class="form-group">
        <input
          type="email"
          name="email"
          placeholder="Enter Email Address"
          formControlName="email"
          required
        />
        <span class="text-danger"
          *ngIf="
            signupForm.get('email')?.touched &&
            signupForm.get('email')?.hasError('email')"
          >Email is required</span>
      </div>

      <!-- Mobile Number -->
      <div class="form-group">
        <input
          type="tel"
          name="mobile"
          placeholder="Enter Mobile Number"
          formControlName="mobile"
          maxlength="10"
          required
        />
        <span class="text-danger"
          *ngIf="
            signupForm.get('mobile')?.touched &&
            signupForm.get('mobile')?.hasError('require')"
          >Mobile number is required</span>
      </div>

      <!-- Password -->
     <div class="form-group password-wrapper">
        <input
          [type]="showPassword ? 'text' : 'password'"
          name="password"
          placeholder="Enter Password"
          formControlName="password"
          maxlength="10"
          required
        />
        <button
          type="button"
          class="toggle-password"
          (click)="togglePassword()"
        >
          <i
            class="fa-solid"
            [ngClass]="showPassword ? 'fa-regular fa-eye fa-jello' : 'fa-eye-slash fa-jello'"
          ></i>
        </button>
                <span class="text-danger"
          *ngIf="
            signupForm.get('password')?.touched &&
            signupForm.get('password')?.hasError('minlength')"
          > Password must be exactly 10 characters</span>
      </div>

      <!-- Confirm Password -->
      <div class="form-group password-wrapper">
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          name="confirmPassword"
          placeholder="Enter Confirm Password"
          formControlName="confirmPassword"
          maxlength="10"
          required
        />
        <button
          type="button"
          class="toggle-password"
          (click)="toggleConfirmPassword()"
        >
          <i
            class="fa-solid"
            [ngClass]="showConfirmPassword ? 'fa-regular fa-eye fa-jello' : 'fa-eye-slash fa-jello'"
          ></i>
        </button>
        <span class="text-danger"
          *ngIf="
            signupForm.get('confirmPassword')?.touched &&
            signupForm.get('confirmPassword')?.hasError('required')"
          >ConfirmPassword is required</span>
      </div>

      <!-- Button -->
      <button type="submit" [disabled]="signupForm.invalid">Sign Up</button>
    </form>

    <p>
      Already have an account ?
      <a routerLink="/login">Login</a>
    </p>
  </div>
</div>
