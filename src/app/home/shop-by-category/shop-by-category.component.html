<section class="shop-category">

  <div class="category-list">
    <a class="category-item" *ngFor="let c of categories">
      <div class="category-circle">
        <img [src]="c.image" [alt]="c.name" loading="lazy" />
      </div>
      <span class="category-name">{{ c.name }}</span>
    </a>
  </div>
</section>
